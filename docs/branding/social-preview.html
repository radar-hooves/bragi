<!doctype html>
<!-- GitHub's social preview for the repository (1280x640). Rendered to social-preview.png; uploaded in the repository's Settings. -->
<html lang="en"><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #161616; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; color: #f2f2f2; position: relative; }
  .glow { position: absolute; inset: 0; background: radial-gradient(900px 520px at 18% 50%, rgba(214, 160, 64, 0.16), transparent 70%); }
  .left { position: absolute; left: 88px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .left img { width: 168px; height: 168px; margin-left: -14px; }
  h1 { margin: 0; font-size: 104px; font-weight: 700; letter-spacing: -2px; line-height: 1; }
  p { margin: 0; font-size: 31px; line-height: 1.3; color: #bdbdbd; }
  /* The screenshot carries its own window frame and shadow. */
  .shot { position: absolute; left: 572px; top: 40px; width: 1040px; }
  .shot img { display: block; width: 100%; }
</style></head><body>
  <div class="glow"></div>
  <div class="left">
    <img src="../../src-tauri/icons/icon.png" alt="">
    <h1>Bragi</h1>
    <p>The desktop player for your own Jellyfin or OpenSubsonic music server</p>
  </div>
  <div class="shot"><img src="screenshot-albums-grid.png" alt=""></div>
</body></html>
