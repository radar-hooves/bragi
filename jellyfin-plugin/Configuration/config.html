<!DOCTYPE html>
<html>
<head>
    <title>Bragi Scrobbler</title>
</head>
<body>
    <div id="BragiScrobblerConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="BragiScrobblerConfigForm">
                    <div class="sectionTitleContainer flex align-items-center">
                        <h2 class="sectionTitle">Bragi Scrobbler Settings</h2>
                    </div>

                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="BragiApiUrl">Bragi API URL</label>
                        <input is="emby-input" type="text" id="BragiApiUrl" required />
                        <div class="fieldDescription">The URL of your Bragi API (e.g., http://bragi.local:8000)</div>
                    </div>

                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="BragiApiToken">API Token</label>
                        <input is="emby-input" type="password" id="BragiApiToken" required />
                        <div class="fieldDescription">Your Bragi API authentication token</div>
                    </div>

                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input is="emby-checkbox" type="checkbox" id="EnableScrobbling" />
                            <span>Enable Scrobbling</span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription">Send scrobbles when tracks are played past the threshold</div>
                    </div>

                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input is="emby-checkbox" type="checkbox" id="EnableSkipTracking" />
                            <span>Enable Skip Tracking</span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription">Record when tracks are skipped before the scrobble threshold</div>
                    </div>

                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <script type="text/javascript">
            var BragiScrobblerConfig = {
                pluginUniqueId: 'a1b2c3d4-e5f6-7890-abcd-ef1234567890'
            };

            document.querySelector('#BragiScrobblerConfigPage')
                .addEventListener('pageshow', function() {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(BragiScrobblerConfig.pluginUniqueId).then(function(config) {
                        document.querySelector('#BragiApiUrl').value = config.BragiApiUrl || '';
                        document.querySelector('#BragiApiToken').value = config.BragiApiToken || '';
                        document.querySelector('#EnableScrobbling').checked = config.EnableScrobbling;
                        document.querySelector('#EnableSkipTracking').checked = config.EnableSkipTracking;
                        Dashboard.hideLoadingMsg();
                    });
                });

            document.querySelector('#BragiScrobblerConfigForm')
                .addEventListener('submit', function(e) {
                    e.preventDefault();
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(BragiScrobblerConfig.pluginUniqueId).then(function(config) {
                        config.BragiApiUrl = document.querySelector('#BragiApiUrl').value;
                        config.BragiApiToken = document.querySelector('#BragiApiToken').value;
                        config.EnableScrobbling = document.querySelector('#EnableScrobbling').checked;
                        config.EnableSkipTracking = document.querySelector('#EnableSkipTracking').checked;
                        ApiClient.updatePluginConfiguration(BragiScrobblerConfig.pluginUniqueId, config).then(function(result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                        });
                    });
                    return false;
                });
        </script>
    </div>
</body>
</html>
